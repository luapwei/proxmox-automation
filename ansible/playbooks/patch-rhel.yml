---
- name: Patch RHEL Hosts
  hosts: rhel
  become: true
  serial: 1
  tasks:
    - name: dnf-utils sicherstellen
      ansible.builtin.dnf:
        name: dnf-utils
        state: present

    - name: Updates einspielen
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: upgrade_result

    - name: Check if reboot is required
      ansible.builtin.command: needs-restarting -r
      register: reboot_required
      changed_when: false
      failed_when: false

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot triggered by ansible patch run"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required.rc == 1

    - name: Summary
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} patched. Reboot triggered: {{ reboot_required.rc == 1 }}"