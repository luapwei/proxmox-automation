---
- name: Patch Debian hosts
  hosts: debian
  become: yes
  serial: 1
  gather_facts: yes

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Upgrade all packages (dist-upgrade)
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: upgrade_result

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if needed
      ansible.builtin.reboot:
        msg: "Reboot triggered by ansible patch run!"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required.stat.exists

    - name: Summary
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} patched. Reboot triggered: {{ reboot_required.stat.exists }}"